    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#3451d1"/>
    </linearGradient>
  </defs>
  <path d="M34 6 H84 L122 44 V96 a26 26 0 0 1 -26 26 H32 a26 26 0 0 1 -26 -26 V34 A28 28 0 0 1 34 6 Z" fill="url(#tile)"/>
  <path d="M84 6 L122 44 H94 a10 10 0 0 1 -10 -10 Z" fill="#1f3aa8" opacity=".35" transform="translate(-3 4)"/>
  <path d="M84 6 L122 44 H94 a10 10 0 0 1 -10 -10 Z" fill="#ffc94d"/>
  <rect x="26" y="56" width="52" height="11" rx="5.5" fill="#fff" opacity=".55"/>
  <rect x="26" y="75" width="74" height="11" rx="5.5" fill="#ffc94d"/>
  <rect x="26" y="94" width="40" height="11" rx="5.5" fill="#fff" opacity=".55"/>
</svg>
