<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Earmark, full detail (48px and up): a page tile with its top-right corner
       folded down in amber, and lines of text where the highlighted one marks
       where you left off. -->
